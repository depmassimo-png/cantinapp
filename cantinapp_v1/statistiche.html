<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiche · CantinApp</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  html {
    background: #0F0405;
    min-height: 100vh;
  }
  body {
    margin: 0 auto;
    padding: 0;
    background: var(--nero, #1a0608);
    color: var(--avorio, #faf7f4);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 480px;
    min-height: 100vh;
    position: relative;
    padding-bottom: 100px;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }
  .stat-header {
    background: var(--nero, #1a0608);
    padding: 14px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stat-back {
    background: none;
    border: none;
    color: var(--oro, #C9A84C);
    font-size: 22px;
    padding: 4px 8px;
    cursor: pointer;
    text-decoration: none;
  }
  .stat-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--oro, #C9A84C);
    flex: 1;
  }
  .stat-section {
    padding: 16px;
  }
  .stat-section-title {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
  }
  .stat-card-label {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }
  .stat-card-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--oro, #C9A84C);
    line-height: 1.1;
  }
  .stat-card-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
  }
  .stat-record {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .stat-record-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(201, 168, 76, 0.15);
    color: var(--oro, #C9A84C);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .stat-record-content {
    flex: 1;
    min-width: 0;
  }
  .stat-record-label {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 2px;
  }
  .stat-record-name {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stat-record-meta {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
  }
  .stat-record-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--oro, #C9A84C);
  }
  .stat-tipologie {
    margin-top: 8px;
  }
  .stat-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .stat-bar-label {
    width: 80px;
    flex-shrink: 0;
    color: rgba(255,255,255,0.75);
  }
  .stat-bar-track {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 4px;
  }
  .stat-bar-fill.bianco { background: #C9A84C; }
  .stat-bar-fill.rosso { background: #8B2635; }
  .stat-bar-fill.rosato { background: #D88FAE; }
  .stat-bar-fill.spumante { background: #5B9FB5; }
  .stat-bar-fill.passito { background: #B97324; }
  .stat-bar-fill.liquoroso { background: #6B4226; }
  .stat-bar-value {
    width: 40px;
    text-align: right;
    color: var(--oro, #C9A84C);
    font-weight: 600;
    flex-shrink: 0;
  }
  .empty-stat {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.5);
  }
  .empty-stat i {
    font-size: 48px;
    color: rgba(255,255,255,0.2);
    margin-bottom: 12px;
    display: block;
  }
  .empty-stat h3 {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 6px;
  }
  .empty-stat p {
    font-size: 13px;
    line-height: 1.5;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    background: var(--nero, #1a0608);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    width: 100%;
    max-width: 480px;
    z-index: 90;
  }
  .nav-item {
    flex: 1;
    padding: 10px 4px 12px;
    text-align: center;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
  }
  .nav-item i { display: block; font-size: 22px; margin-bottom: 2px; }
  .nav-item.active { color: var(--oro, #C9A84C); }
  .nav-item.active i { color: var(--oro, #C9A84C); }
</style>
</head>
<body>

<div class="stat-header">
  <a href="cantina.html" class="stat-back" aria-label="Indietro">
    <i class="ti ti-arrow-left"></i>
  </a>
  <div class="stat-title">Statistiche cantina</div>
</div>

<div id="contentArea">
  <div class="empty-stat">
    <i class="ti ti-loader-2"></i>
    <h3>Caricamento...</h3>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <a href="cantina.html" class="nav-item">
    <i class="ti ti-building-warehouse"></i>
    Cantina
  </a>
  <a href="bevute.html" class="nav-item">
    <i class="ti ti-glass-full"></i>
    Bevute
  </a>
  <a href="aggiungi.html" class="nav-item nav-add" aria-label="Aggiungi bottiglia">
    <span class="nav-add-circle">
      <i class="ti ti-plus"></i>
    </span>
    Aggiungi
  </a>
  <a href="degusta.html" class="nav-item">
    <i class="ti ti-sparkles"></i>
    Degusta
  </a>
  <a href="teoria.html" class="nav-item">
    <i class="ti ti-book"></i>
    Teoria
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/geo-data.js"></script>
<script src="js/statistiche.js"></script>

</body>
</html>
