<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a0608">
  <title>CantinApp — Accedi</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CantinApp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    .tabs {
      display: flex;
      background: var(--avorio-dk);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.55);
      transition: all .2s;
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .tab.tab-active {
      background: rgba(255,255,255,0.04);
      color: var(--bordeaux);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .pwd-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--testo-3);
      font-size: 18px;
      padding: 0;
      line-height: 1;
    }
  </style>
</head>
<body class="dark">

<div style="max-width: 480px; margin: 0 auto; padding: 0 20px 40px;">

  <div style="text-align:center;padding:24px 0 28px;">
    <img src="banner.png" alt="La tua cantina personale" style="width:100%;max-width:480px;border-radius:var(--radius-lg);display:block;margin:0 auto">
  </div>

  <div class="login-card">
    <div class="tabs">
      <button class="tab tab-active" id="tabLogin" onclick="showLogin()">Accedi</button>
      <button class="tab" id="tabRegister" onclick="showRegister()">Registrati</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="formLogin" onsubmit="handleLogin(event)">
      <label class="field-label" for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="tuo@email.com" autocomplete="email" required>

      <label class="field-label" for="loginPassword" style="margin-top:14px">Password</label>
      <div class="password-wrap">
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="pwd-toggle" onclick="togglePwd('loginPassword',this)" aria-label="Mostra password">
          <i class="ti ti-eye"></i>
        </button>
      </div>

      <div style="margin-top: 6px; text-align: right;">
        <a href="#" style="font-size:13px; color:var(--bordeaux); text-decoration:none;" onclick="showForgot(); return false;">Password dimenticata?</a>
      </div>

      <div style="margin-top: 20px;">
        <button type="submit" class="btn btn-primary" id="btnLogin">
          <i class="ti ti-login" style="font-size:18px" aria-hidden="true"></i>
          Accedi
        </button>
      </div>
    </form>

    <!-- FORM REGISTRAZIONE -->
    <form id="formRegister" style="display:none" onsubmit="handleRegister(event)">
      <label class="field-label" for="regUsername">Nome utente</label>
      <input type="text" id="regUsername" placeholder="Come vuoi essere chiamato" autocomplete="username" required>

      <label class="field-label" for="regEmail" style="margin-top:14px">Email</label>
      <input type="email" id="regEmail" placeholder="tuo@email.com" autocomplete="email" required>

      <label class="field-label" for="regPassword" style="margin-top:14px">Password</label>
      <div class="password-wrap">
        <input type="password" id="regPassword" placeholder="Minimo 6 caratteri" autocomplete="new-password" required>
        <button type="button" class="pwd-toggle" onclick="togglePwd('regPassword',this)" aria-label="Mostra password">
          <i class="ti ti-eye"></i>
        </button>
      </div>

      <label class="field-label" for="regConfirm" style="margin-top:14px">Conferma password</label>
      <div class="password-wrap">
        <input type="password" id="regConfirm" placeholder="Ripeti la password" autocomplete="new-password" required>
        <button type="button" class="pwd-toggle" onclick="togglePwd('regConfirm',this)" aria-label="Mostra password">
          <i class="ti ti-eye"></i>
        </button>
      </div>

      <div style="margin-top: 20px;">
        <button type="submit" class="btn btn-primary" id="btnRegister">
          <i class="ti ti-user-plus" style="font-size:18px" aria-hidden="true"></i>
          Crea account
        </button>
      </div>
    </form>
  </div>

  <!-- FORGOT PASSWORD (hidden) -->
  <div id="formForgot" style="display:none">
    <div class="login-card">
      <div style="margin-bottom:14px">
        <div style="font-size:16px;font-weight:500;color:var(--avorio);margin-bottom:4px">Reimposta password</div>
        <div style="font-size:13px;color:var(--testo-2)">Ti mandiamo un link via email</div>
      </div>
      <label class="field-label">Email</label>
      <input type="email" id="emailForgot" placeholder="tuo@email.com">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" style="width:auto;flex:1" onclick="showLogin()">Annulla</button>
        <button class="btn btn-primary btn-sm" style="flex:2" id="btnForgot" onclick="handleForgot()">
          <i class="ti ti-mail" style="font-size:16px" aria-hidden="true"></i> Invia link
        </button>
      </div>
    </div>
  </div>

  <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--testo-3)">
    Usa la scheda ufficiale Assosommelier
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  // Se un link di recupero password atterra qui (vecchie email o fallback
  // al Site URL), inoltra alla pagina dedicata mantenendo il token.
  // redirectIfLogged() parte solo se NON siamo in un flusso di recupero.
  (function reindirizzaRecovery() {
    const h = window.location.hash || '';
    if (/type=recovery/.test(h)) {
      window.location.replace('reset-password.html' + window.location.search + h);
      return true;
    }
    return false;
  })() || redirectIfLogged();

  // Mostra/nascondi password
  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const nascosta = input.type === 'password';
    input.type = nascosta ? 'text' : 'password';
    btn.querySelector('i').className = nascosta ? 'ti ti-eye-off' : 'ti ti-eye';
  }

  // Navigazione tra i tre pannelli: login / registrazione / recupero
  function mostraPannello(quale) {
    document.getElementById('formLogin').style.display    = quale === 'login'    ? 'block' : 'none';
    document.getElementById('formRegister').style.display = quale === 'register' ? 'block' : 'none';
    document.getElementById('formForgot').style.display   = quale === 'forgot'   ? 'block' : 'none';
    document.getElementById('tabLogin').classList.toggle('tab-active', quale === 'login');
    document.getElementById('tabRegister').classList.toggle('tab-active', quale === 'register');
  }
  function showLogin()    { mostraPannello('login'); }
  function showRegister() { mostraPannello('register'); }
  function showForgot()   { mostraPannello('forgot'); }

  // Login
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showToast('Compila tutti i campi', true); return; }
    setLoading(btn, true);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    setLoading(btn, false);
    if (error) { showToast(error.message, true); return; }
    window.location.href = 'cantina.html';
  }

  // Registrazione
  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('btnRegister');
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    if (!username || !email || !password || !confirm) { showToast('Compila tutti i campi', true); return; }
    if (password !== confirm) { showToast('Le password non coincidono', true); return; }
    if (password.length < 6) { showToast('Password di almeno 6 caratteri', true); return; }
    setLoading(btn, true);
    const { error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
    setLoading(btn, false);
    if (error) { showToast(error.message, true); return; }
    showToast('Account creato! Controlla la tua email per confermare.');
    setTimeout(showLogin, 2500);
  }

  // Recupero password
  async function handleForgot() {
    const btn = document.getElementById('btnForgot');
    const email = document.getElementById('emailForgot').value.trim();
    if (!email) { showToast('Inserisci la tua email', true); return; }
    setLoading(btn, true);
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: new URL('reset-password.html', window.location.href).href
    });
    setLoading(btn, false);
    if (error) { showToast(error.message, true); return; }
    showToast('Link inviato! Controlla la tua email.');
    setTimeout(showLogin, 2500);
  }
</script>
</body>
</html>
