<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a0608">
  <title>CantinApp — Reimposta password</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CantinApp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    html { background: #0F0405; min-height: 100vh; }
    body {
      background: var(--nero, #1a0608); color: var(--avorio, #faf7f4);
      min-height: 100vh; max-width: 480px; margin: 0 auto; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
    }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand img { width: 56px; height: 56px; border-radius: 12px; }
    .brand .name { font-size: 24px; font-weight: 700; color: var(--oro, #C9A84C); margin-top: 8px; letter-spacing: .3px; }

    .card {
      width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 22px;
    }
    .card h1 { font-size: 18px; color: #fff; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .card h1 i { color: var(--oro, #C9A84C); }
    .card .sub { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; margin: 0 0 16px; }

    .field-label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin: 14px 0 6px; }
    .inp {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; box-sizing: border-box; outline: none;
    }
    .inp:focus { border-color: var(--oro, #C9A84C); }
    .btn {
      width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 10px;
      background: var(--oro, #C9A84C); color: var(--nero, #1a0608); font-weight: 700; font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.6; }
    .link { display: block; text-align: center; margin-top: 16px; color: var(--oro, #C9A84C); font-size: 13px; text-decoration: none; }

    .stato { text-align: center; padding: 12px 0; }
    .stato i { font-size: 30px; display: block; margin-bottom: 10px; }
    .stato.loading i { color: var(--oro, #C9A84C); animation: spin .7s linear infinite; }
    .stato.error i { color: #F85149; }
    .stato p { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.5; margin: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="brand">
  <img src="logo.png" alt="">
  <div class="name">CantinApp</div>
</div>

<div class="card">
  <!-- Stato iniziale: verifica del link -->
  <div id="statoVerifica" class="stato loading">
    <i class="ti ti-loader-2"></i>
    <p>Verifica del link in corso…</p>
  </div>

  <!-- Form nuova password (nascosto finché il link non è validato) -->
  <div id="formReset" style="display:none">
    <h1><i class="ti ti-lock-cog"></i> Nuova password</h1>
    <p class="sub">Scegli una nuova password per il tuo account.</p>

    <label class="field-label">Nuova password</label>
    <input type="password" id="pwd1" class="inp" placeholder="Almeno 6 caratteri" autocomplete="new-password">

    <label class="field-label">Conferma password</label>
    <input type="password" id="pwd2" class="inp" placeholder="Ripeti la password" autocomplete="new-password">

    <button class="btn" id="btnSalva" onclick="aggiornaPassword()">
      <i class="ti ti-check"></i> Salva nuova password
    </button>
  </div>

  <!-- Stato di errore -->
  <div id="statoErrore" class="stato error" style="display:none">
    <i class="ti ti-alert-triangle"></i>
    <p id="erroreMsg">Link non valido o scaduto.</p>
    <a class="link" href="index.html">← Torna al login</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset-password.js?v=2"></script>
</body>
</html>
