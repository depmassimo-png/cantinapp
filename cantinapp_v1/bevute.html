<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a0608">
  <title>CantinApp — Bevute</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CantinApp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    /* === Sfondo scuro coerente (override del CSS condiviso chiaro) === */
    html {
      background: #0F0405;
      min-height: 100vh;
    }
    body {
      background: var(--nero, #1a0608);
      color: var(--avorio, #faf7f4);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      padding-bottom: 100px;
      box-shadow: 0 0 60px rgba(0,0,0,0.5);
    }

    /* === Header brand (identico a cantina.html V3) === */
    .header-bevute {
      background: var(--nero, #1a0608);
      padding: 14px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: block;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--oro, #C9A84C);
      letter-spacing: 0.3px;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      line-height: 1.1;
    }

    /* === Stat cards (tema scuro) === */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 16px 4px;
    }
    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--oro, #C9A84C);
      line-height: 1.1;
    }
    .stat-lbl {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 4px;
    }

    /* === Search bar (tema scuro) === */
    .search-bar {
      padding: 12px 16px 8px;
    }
    .search-input-wrap {
      position: relative;
    }
    .search-input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 12px 10px 38px;
      font-size: 14px;
      color: var(--avorio, #faf7f4);
      font-family: inherit;
      outline: none;
    }
    .search-input-wrap input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .search-input-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 17px;
    }

    /* === Lista bevute === */
    .list-area {
      padding: 6px 16px 20px;
    }

    /* Titoli sezione (Da valutare / Degustazioni complete) */
    .bev-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .bev-section-title:first-child { margin-top: 6px; }
    .bev-section-title i {
      color: var(--oro, #C9A84C);
      font-size: 16px;
    }
    .bev-section-count {
      margin-left: auto;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
    }

    /* === Card degustazione === */
    .degust-card {
      position: relative;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 14px 14px 18px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      display: block;
      overflow: hidden;
      transition: transform .15s, background .15s;
    }
    .degust-card:active {
      transform: scale(0.98);
      background: rgba(255,255,255,0.05);
    }
    /* Strip colorata laterale per tipologia */
    .degust-stripe {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
    }
    .stripe-rosso     { background: #8B2635; }
    .stripe-bianco    { background: #C9A84C; }
    .stripe-rosato    { background: #D88FAE; }
    .stripe-spumante  { background: #5B9FB5; }
    .stripe-passito   { background: #B97324; }
    .stripe-liquoroso { background: #6B4226; }
    .stripe-default   { background: rgba(255,255,255,0.2); }

    .degust-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    /* Layout con thumbnail */
    .degust-row {
      display: flex;
      align-items: stretch;
      gap: 12px;
    }
    .degust-thumb {
      width: 52px;
      min-width: 52px;
      height: 70px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .degust-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .degust-thumb i {
      color: rgba(255,255,255,0.3);
      font-size: 26px;
    }
    .degust-body {
      flex: 1;
      min-width: 0;
    }
    .degust-info {
      flex: 1;
      min-width: 0;
    }
    .degust-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--avorio, #faf7f4);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .degust-prod {
      font-size: 12.5px;
      color: rgba(255,255,255,0.55);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .degust-right {
      flex-shrink: 0;
      text-align: right;
    }
    .degust-punti {
      font-size: 26px;
      font-weight: 700;
      color: var(--oro, #C9A84C);
      line-height: 1;
    }
    .degust-punti-max {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-left: 1px;
    }
    .degust-data {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 4px;
    }
    .degust-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }
    /* Tipo labels (riusiamo i colori cantina) */
    .tipo-label {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    .tipo-rosso     { background: rgba(139,38,53,0.22);  color: #E89A8B; }
    .tipo-bianco    { background: rgba(201,168,76,0.18); color: #E5D49B; }
    .tipo-rosato    { background: rgba(216,143,174,0.18); color: #F3CFE1; }
    .tipo-spumante  { background: rgba(91,159,181,0.18); color: #ACD6E1; }
    .tipo-passito   { background: rgba(185,115,36,0.20); color: #E0B383; }
    .tipo-liquoroso { background: rgba(107,66,38,0.30);  color: #C9A78A; }

    /* Stelline voto piacere personale */
    .stars-line {
      color: var(--oro, #C9A84C);
      font-size: 13px;
      letter-spacing: 1.5px;
    }
    .stars-line .empty { color: rgba(255,255,255,0.15); }

    /* Tag generico (luogo / fascia) */
    .degust-tag {
      font-size: 10.5px;
      color: rgba(255,255,255,0.65);
      background: rgba(255,255,255,0.06);
      padding: 3px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .degust-tag i { font-size: 11px; opacity: 0.8; }

    /* Card 'Da valutare' (senza scheda compilata) */
    .degust-card-pending {
      background: rgba(201,168,76,0.06);
      border-color: rgba(201,168,76,0.25);
    }
    .degust-pending-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--oro, #C9A84C);
      color: var(--nero, #1a0608);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .degust-pending-pill i { font-size: 12px; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.5);
    }
    .empty i {
      font-size: 48px;
      color: rgba(255,255,255,0.18);
      display: block;
      margin-bottom: 12px;
    }
    .empty h3 {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .empty p {
      font-size: 13px;
      line-height: 1.5;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.5);
    }
    .loading i {
      font-size: 30px;
      display: block;
      margin-bottom: 8px;
      color: var(--oro, #C9A84C);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* === Bottom nav (override scuro come cantina) === */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: var(--nero, #1a0608);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      width: 100%;
      max-width: 480px;
      z-index: 90;
    }
    .nav-item {
      flex: 1;
      padding: 10px 4px 12px;
      text-align: center;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
    }
    .nav-item i { display: block; font-size: 22px; margin-bottom: 2px; }
    .nav-item.active { color: var(--oro, #C9A84C); }
    .nav-item.active i { color: var(--oro, #C9A84C); }
    .nav-add { color: var(--bordeaux, #8B2635) !important; font-weight: 600; }
    .nav-add-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bordeaux, #8B2635);
      color: #fff !important;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2px;
      box-shadow: 0 2px 8px rgba(139,38,53,0.4);
    }
    .nav-add-circle i { font-size: 22px !important; color: #fff !important; margin: 0 !important; }
  </style>
</head>
<body>

<div class="header-bevute">
  <div class="header-row">
    <div class="header-brand">
      <img src="logo.png" alt="" class="brand-logo">
      <div class="brand-text">
        <div class="brand-name">CantinApp</div>
        <div class="brand-sub" id="totaleBevute">0 degustazioni</div>
      </div>
    </div>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-num" id="statTot">0</div>
    <div class="stat-lbl">Degustazioni</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statMedia">—</div>
    <div class="stat-lbl">Punteggio medio</div>
  </div>
</div>

<div class="search-bar">
  <div class="search-input-wrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="searchInput" placeholder="Cerca vino, produttore..." oninput="renderList()">
  </div>
</div>

<div class="list-area" id="listArea">
  <div class="loading">
    <i class="ti ti-loader-2"></i>
    Caricamento bevute...
  </div>
</div>

<nav class="bottom-nav">
  <a href="cantina.html" class="nav-item">
    <i class="ti ti-building-warehouse"></i>
    Cantina
  </a>
  <a href="bevute.html" class="nav-item active">
    <i class="ti ti-glass-full"></i>
    Bevute
  </a>
  <a href="aggiungi.html" class="nav-item nav-add" aria-label="Aggiungi bottiglia">
    <span class="nav-add-circle">
      <i class="ti ti-plus"></i>
    </span>
    Aggiungi
  </a>
  <a href="degusta.html" class="nav-item">
    <i class="ti ti-sparkles"></i>
    Degusta
  </a>
  <a href="teoria.html" class="nav-item">
    <i class="ti ti-book"></i>
    Teoria
  </a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/bevute.js"></script>
</body>
</html>
