<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a0608">
  <title>CantinApp — Le mie bevute</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CantinApp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    .header-bevute {
      background: var(--nero);
      padding: 16px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-bevute h1 {
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .header-bevute h1 i { color: var(--oro); }
    .header-bevute .sub {
      font-size: 12px;
      color: rgba(255,255,255,.55);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    .stat-card {
      background: var(--bianco);
      border: 1px solid var(--bordo);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 600;
      color: var(--bordeaux);
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .stat-num.oro { color: var(--oro); }
    .stat-lbl {
      font-size: 11px;
      color: var(--testo-2);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .search-bar {
      background: var(--bianco);
      padding: 12px 16px;
      border-bottom: 1px solid var(--bordo);
      display: flex;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto;
    }
    .search-input-wrap {
      flex: 1;
      position: relative;
    }
    .search-input-wrap input { padding-left: 38px; }
    .search-input-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--testo-3);
      font-size: 18px;
    }

    .list-area {
      padding: 12px 16px 100px;
      max-width: 480px;
      margin: 0 auto;
    }

    .degust-card {
      background: var(--bianco);
      border: 1px solid var(--bordo);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: all .15s;
    }
    .degust-card:active { transform: scale(.98); }

    .degust-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .degust-info {
      flex: 1;
      min-width: 0;
    }
    .degust-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--testo);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .degust-prod {
      font-size: 12px;
      color: var(--testo-2);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .degust-right {
      flex-shrink: 0;
      text-align: right;
    }
    .degust-punti {
      font-size: 24px;
      font-weight: 600;
      color: var(--bordeaux);
      line-height: 1;
    }
    .degust-punti-max {
      font-size: 11px;
      color: var(--testo-3);
    }
    .degust-data {
      font-size: 11px;
      color: var(--testo-2);
      margin-top: 4px;
    }

    .degust-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .degust-fascia {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }
    .f-accettabile { background: #f5f3f0; color: #6a5a4a; }
    .f-buono { background: var(--bordeaux-lt); color: var(--bordeaux); }
    .f-ottimo { background: var(--oro-lt); color: #7a5a10; }
    .f-eccellente { background: #f5eaec; color: var(--bordeaux-dk); }
    .f-memorabile { background: var(--nero); color: var(--oro); }

    .stars-line {
      color: var(--oro);
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .stars-line .empty { color: var(--bordo); }

    .degust-note {
      font-size: 13px;
      color: var(--testo-2);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--bordo);
      font-style: italic;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--testo-2);
    }
    .loading i {
      font-size: 32px;
      animation: spin .7s linear infinite;
      display: block;
      margin-bottom: 8px;
      color: var(--bordeaux);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bianco);
      border-top: 1px solid var(--bordo);
      display: flex;
      max-width: 480px;
      margin: 0 auto;
      z-index: 90;
    }
    .nav-item {
      flex: 1;
      padding: 10px 4px 12px;
      text-align: center;
      color: var(--testo-2);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      transition: color .15s;
    }
    .nav-item i {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }
    .nav-item.active { color: var(--bordeaux); }
    .nav-item.active i { color: var(--bordeaux); }
  </style>
</head>
<body>

<div class="header-bevute">
  <h1>
    <img src="logo.png" alt="" class="logo-mini">
    Le mie bevute
  </h1>
  <div class="sub" id="totaleBevute">— degustazioni</div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-num" id="statTot">0</div>
    <div class="stat-lbl">Degustazioni</div>
  </div>
  <div class="stat-card">
    <div class="stat-num oro" id="statMedia">—</div>
    <div class="stat-lbl">Punteggio medio</div>
  </div>
</div>

<div class="search-bar">
  <div class="search-input-wrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="searchInput" placeholder="Cerca vino, produttore..." oninput="renderList()">
  </div>
</div>

<div id="listArea">
  <div class="loading">
    <i class="ti ti-loader-2"></i>
    Caricamento bevute...
  </div>
</div>

<nav class="bottom-nav">
  <a href="cantina.html" class="nav-item">
    <i class="ti ti-building-warehouse"></i>
    Cantina
  </a>
  <a href="bevute.html" class="nav-item active">
    <i class="ti ti-glass-full"></i>
    Bevute
  </a>
  <a href="degusta.html" class="nav-item">
    <i class="ti ti-plus" style="background:var(--bordeaux);color:#fff;border-radius:50%;width:32px;height:32px;line-height:32px;margin:0 auto 4px"></i>
    Degusta
  </a>
  <a href="teoria.html" class="nav-item">
    <i class="ti ti-book"></i>
    Teoria
  </a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/bevute.js"></script>
</body>
</html>
