<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0608">
<title>Admin · CantinApp</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body.dark { background: var(--nero); color: var(--avorio); padding-bottom: 100px; }
  .admin-header {
    padding: 24px 20px 16px;
    background: linear-gradient(135deg, rgba(139,38,53,0.15), rgba(201,168,76,0.08));
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }
  .admin-header h1 {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 4px;
    font-size: 22px; font-weight: 600; color: var(--oro);
  }
  .admin-header .subtitle {
    color: rgba(255,255,255,0.6); font-size: 13px;
  }
  .admin-content {
    max-width: 600px; margin: 0 auto; padding: 20px;
  }
  .admin-section {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .admin-section-title {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    font-size: 13px; font-weight: 700; color: var(--oro);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .admin-section-title i { font-size: 18px; }
  .pending-badge {
    background: var(--bordeaux);
    color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px;
    letter-spacing: 0.3px;
  }
  .pending-badge.zero { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
  .msg-testo {
    font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
    background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px;
  }
  .risposta-input {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 60px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; color: #fff; font-family: inherit; font-size: 13px;
    padding: 8px 10px; outline: none;
  }
  .risposta-input:focus { border-color: var(--oro, #C9A84C); }
  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0;
    font-size: 14px; color: rgba(255,255,255,0.75);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .v {
    color: var(--oro); font-weight: 600; font-size: 16px;
  }
  .placeholder-text {
    font-size: 12px; color: rgba(255,255,255,0.45);
    font-style: italic; margin-top: 8px;
  }
  .auth-error {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.6);
  }
  .auth-error i {
    font-size: 48px; color: var(--bordeaux);
    display: block; margin-bottom: 12px;
  }
  .pending-list { margin-top: 12px; max-height: 50vh; overflow-y: auto; }
  .pending-item {
    display: flex; gap: 8px; align-items: center;
    padding: 10px; background: rgba(255,255,255,0.03);
    border-radius: 8px; margin-bottom: 6px;
    border-left: 3px solid rgba(201,168,76,0.4);
  }
  .pending-item .nome {
    flex: 1;
    font-size: 14px; color: #fff; font-weight: 500;
  }
  .pending-item .meta {
    font-size: 11px; color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }
  .pending-actions {
    display: flex; gap: 6px;
  }
  .btn-mini {
    background: none; border: 1px solid; padding: 4px 10px;
    border-radius: 6px; font-size: 11px; cursor: pointer;
    font-family: inherit; font-weight: 600;
  }
  .btn-mini.approve { border-color: rgba(46, 160, 67, 0.5); color: #2EA043; }
  .btn-mini.reject { border-color: rgba(248, 81, 73, 0.5); color: #F85149; }

  /* Form approva inline */
  .approve-form {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(201,168,76,0.2);
  }
  .approve-form-inner {
    background: rgba(201,168,76,0.05);
    border-radius: 8px;
    padding: 12px;
  }
  .approve-label {
    display: block;
    font-size: 10px;
    color: rgba(201,168,76,0.8);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-bottom: 4px;
    margin-top: 8px;
  }
  .approve-label:first-child { margin-top: 0; }
  .approve-input {
    width: 100%;
    padding: 7px 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
  }
  .approve-input:focus { border-color: var(--oro); }
  .approve-row {
    display: flex;
    gap: 8px;
  }
  .approve-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 12px;
  }

  /* === Bottone "+ Aggiungi" === */
  .btn-add {
    background: rgba(46, 160, 67, 0.15);
    border: 1px solid rgba(46, 160, 67, 0.4);
    color: #2EA043;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-add:active { background: rgba(46, 160, 67, 0.25); }

  /* Bottone inline (dentro l'albero) per aggiungere figli */
  .tree-add-row {
    margin: 6px 0 8px;
  }
  .btn-add-inline {
    background: rgba(46, 160, 67, 0.08);
    border: 1px dashed rgba(46, 160, 67, 0.35);
    color: rgba(46, 160, 67, 0.85);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-add-inline:active { background: rgba(46, 160, 67, 0.18); }
  .btn-add-inline i { font-size: 14px; }

  /* Toolbar espandi/collassa */
  .albero-toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .btn-tool {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .btn-tool:active { background: rgba(255,255,255,0.08); }
  .btn-tool i { font-size: 13px; }

  /* === Albero famiglie/sottocategorie/sentori === */
  .albero-sentori { margin-top: 4px; }
  .tree-fam {
    margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    overflow: hidden;
  }
  .tree-fam-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    user-select: none;
  }
  .tree-fam-header:active { background: rgba(255,255,255,0.05); }
  .tree-fam-label {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
  }
  .tree-toggle {
    cursor: pointer;
    color: rgba(201,168,76,0.7);
    font-size: 16px;
    flex-shrink: 0;
  }
  .tree-toggle:active { color: var(--oro); }
  .tree-count {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
    margin-right: 4px;
  }
  .tree-color-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
    cursor: pointer;
  }
  .tree-fam-body {
    padding: 4px 10px 8px 28px;
    background: rgba(0,0,0,0.2);
  }
  .tree-sub {
    margin-top: 4px;
    border-left: 2px solid rgba(201,168,76,0.2);
    border-radius: 4px;
  }
  .tree-sub-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    user-select: none;
  }
  .tree-sub-header:active { background: rgba(255,255,255,0.03); }
  .tree-sub-text {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .tree-sub-label {
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }
  .tree-sub-meta {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }
  .tree-sub-body {
    padding: 4px 10px 6px 20px;
  }

  /* === Riga sentore con azioni === */
  .sent-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 6px;
    margin-bottom: 3px;
  }
  .sent-nome {
    font-size: 12.5px;
    color: #fff;
  }
  .sent-ctx {
    font-size: 10px;
    color: rgba(201,168,76,0.6);
    margin-top: 2px;
  }
  .sent-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .icon-btn {
    background: none;
    border: none;
    color: rgba(201,168,76,0.7);
    padding: 4px 6px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
  }
  .icon-btn:hover { color: var(--oro); background: rgba(201,168,76,0.1); }
  .icon-btn.danger { color: rgba(248, 81, 73, 0.7); }
  .icon-btn.danger:hover { color: #F85149; background: rgba(248, 81, 73, 0.1); }

  /* === Lista sottocategorie raggruppata === */
  .sub-group {
    margin-bottom: 14px;
  }
  .sub-group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--oro);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }
  .sub-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    margin-bottom: 4px;
  }
  .sub-row-label {
    font-size: 13px;
    color: #fff;
    font-weight: 500;
  }
  .sub-row-meta {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
    word-break: break-all;
  }

</style>
</head>
<body class="dark">

<div class="admin-header">
  <h1><i class="ti ti-shield-lock"></i> Pannello Admin</h1>
  <div class="subtitle">Gestione sentori olfattivi</div>
</div>

<div class="admin-content" id="adminContent">
  <div class="auth-error">
    <i class="ti ti-loader-2" style="animation:spin .7s linear infinite"></i>
    Verifica autorizzazioni...
  </div>
</div>

<nav class="bottom-nav">
  <a href="cantina.html" class="nav-item">
    <i class="ti ti-building-warehouse"></i>
    Cantina
  </a>
  <a href="degusta.html" class="nav-item">
    <i class="ti ti-sparkles"></i>
    Degusta
  </a>
  <a href="bevute.html" class="nav-item">
    <i class="ti ti-glass-full"></i>
    Bevute
  </a>
  <a href="statistiche.html" class="nav-item">
    <i class="ti ti-chart-bar"></i>
    Stats
  </a>
  <a href="teoria.html" class="nav-item">
    <i class="ti ti-book"></i>
    Teoria
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
(async function init() {
  const session = await requireAuth();
  if (!session) return;
  const currentUser = session.user;

  // Verifica is_admin
  const { data: profile } = await sb
    .from('profiles')
    .select('is_admin')
    .eq('id', currentUser.id)
    .maybeSingle();

  const content = document.getElementById('adminContent');

  if (!profile || !profile.is_admin) {
    content.innerHTML = `
      <div class="auth-error">
        <i class="ti ti-lock"></i>
        <h3 style="margin:0 0 6px;color:#fff">Accesso non autorizzato</h3>
        <p style="margin:0;font-size:13px">Questa area è riservata agli amministratori.</p>
        <p style="margin:16px 0 0">
          <a href="cantina.html" style="color:var(--oro);font-size:13px">← Torna alla cantina</a>
        </p>
      </div>`;
    return;
  }

  // Carica statistiche
  const [pendCount, sentCount, famCount, subCount, msgCount] = await Promise.all([
    sb.from('sentori').select('id', { count: 'exact', head: true }).eq('stato', 'pending'),
    sb.from('sentori').select('id', { count: 'exact', head: true }).eq('stato', 'attivo'),
    sb.from('famiglie_olfattive').select('id', { count: 'exact', head: true }),
    sb.from('sottocategorie_olfattive').select('id', { count: 'exact', head: true }),
    sb.from('messaggi_admin').select('id', { count: 'exact', head: true }).eq('stato', 'aperta'),
  ]);

  const nPending = pendCount.count || 0;
  const nSentori = sentCount.count || 0;
  const nFamiglie = famCount.count || 0;
  const nSottoc = subCount.count || 0;
  const nMessaggi = msgCount.count || 0;

  content.innerHTML = `
    <div class="admin-section">
      <div class="admin-section-title">
        <span><i class="ti ti-clock-pause"></i> Sentori in attesa</span>
        <span class="pending-badge ${nPending === 0 ? 'zero' : ''}">${nPending}</span>
      </div>
      ${nPending > 0
        ? '<div class="placeholder-text">Voci candidate da approvare o rifiutare. Pannello completo in sviluppo.</div><div id="pendingList" class="pending-list"></div>'
        : '<div class="placeholder-text">Nessun candidato in attesa. Le voci personali inserite nelle "Note olfattive aggiuntive" dagli utenti appariranno qui per essere approvate.</div>'
      }
    </div>

    <div class="admin-section">
      <div class="admin-section-title">
        <span><i class="ti ti-messages"></i> Richieste utenti</span>
        <span class="pending-badge messaggi-badge ${nMessaggi === 0 ? 'zero' : ''}">${nMessaggi}</span>
      </div>
      <div id="messaggiList" class="pending-list">
        <div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px">Caricamento...</div>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-title">
        <span><i class="ti ti-chart-pie"></i> Stato sentori</span>
      </div>
      <div class="stat-row">
        <span>Famiglie olfattive</span>
        <span class="v">${nFamiglie}</span>
      </div>
      <div class="stat-row">
        <span>Sottocategorie</span>
        <span class="v">${nSottoc}</span>
      </div>
      <div class="stat-row">
        <span>Sentori attivi</span>
        <span class="v">${nSentori}</span>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-title">
        <span><i class="ti ti-plant"></i> Gestione olfattiva</span>
        <button class="btn-add" onclick="apriFormAggiungiFamiglia()">+ Famiglia</button>
      </div>
      <input type="text" id="searchSentori" placeholder="Cerca un sentore..." class="approve-input" style="margin-bottom:10px" oninput="filtraSentori()">
      <div class="albero-toolbar">
        <button class="btn-tool" onclick="espandiTutto()" title="Espandi tutto"><i class="ti ti-layout-rows"></i> Espandi tutto</button>
        <button class="btn-tool" onclick="collassaTutto()" title="Collassa tutto"><i class="ti ti-fold"></i> Collassa</button>
      </div>
      <div id="formAggiungiFamiglia" style="display:none"></div>
      <div id="formAggiungiSottocategoria" style="display:none"></div>
      <div id="formAggiungiSentore" style="display:none"></div>
      <div id="alberoSentori" class="albero-sentori"></div>
    </div>

    <div class="admin-section">
      <div class="admin-section-title">
        <span><i class="ti ti-download"></i> Export</span>
      </div>
      <p style="font-size:12px;color:rgba(255,255,255,0.65);margin:0 0 10px;line-height:1.5">
        Esporta il file <code>aromi-data.js</code> aggiornato per allineare il fallback offline al DB.
        Scarica il file e sostituiscilo in <code>js/aromi-data.js</code> nel repo GitHub.
      </p>
      <button class="btn-add" style="width:100%" onclick="esportaAromiDataJs()">
        <i class="ti ti-file-download" style="font-size:14px;vertical-align:middle"></i>
        Scarica aromi-data.js
      </button>
    </div>
  `;

  // Se ci sono pending, mostra la lista breve
  if (nPending > 0) {
    await renderPendingList();
  }

  // Richieste utenti
  await renderMessaggiAdmin();

  // Carica le nuove sezioni CRUD (sentori/sottocategorie/famiglie)
  await caricaTuttiDati();
  renderAlberoSentori();
})();

async function renderPendingList() {
  const { data: pendList } = await sb.from('sentori')
    .select('id, nome, note_origine, created_at')
    .eq('stato', 'pending')
    .order('created_at', { ascending: false })
    .limit(50);

  const list = document.getElementById('pendingList');
  if (!list || !pendList) return;

  if (pendList.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px">Nessuna voce in attesa</div>';
    // Aggiorna anche il badge in alto
    const badge = document.querySelector('.pending-badge');
    if (badge) {
      badge.textContent = '0';
      badge.classList.add('zero');
    }
    return;
  }

  list.innerHTML = pendList.map(s => `
    <div class="pending-item" data-id="${s.id}">
      <div style="flex:1;min-width:0">
        <div class="nome">${escapeHtml(s.nome)}</div>
        ${s.note_origine ? `<div class="meta">Da: "${escapeHtml(s.note_origine.substring(0,80))}${s.note_origine.length > 80 ? '...' : ''}"</div>` : ''}
        <div class="approve-form" id="approveForm-${s.id}" style="display:none"></div>
      </div>
      <div class="pending-actions">
        <button class="btn-mini approve" onclick="apriFormApprova('${s.id}', '${escapeAttr(s.nome)}')">✓ Approva</button>
        <button class="btn-mini reject" onclick="rifiutaPending('${s.id}')">✕ Rifiuta</button>
      </div>
    </div>
  `).join('');
}

// ---- Richieste utenti (messaggi_admin) ----
async function renderMessaggiAdmin() {
  const list = document.getElementById('messaggiList');
  if (!list) return;

  const { data: msgs, error } = await sb.from('messaggi_admin')
    .select('id, username, email, oggetto, testo, created_at')
    .eq('stato', 'aperta')
    .order('created_at', { ascending: false })
    .limit(50);

  const badge = document.querySelector('.messaggi-badge');

  if (error) {
    list.innerHTML = `<div style="text-align:center;padding:20px;color:#F85149;font-size:13px">Errore: ${escapeHtml(error.message)}</div>`;
    return;
  }

  if (!msgs || msgs.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px">Nessuna richiesta aperta</div>';
    if (badge) { badge.textContent = '0'; badge.classList.add('zero'); }
    return;
  }

  if (badge) { badge.textContent = String(msgs.length); badge.classList.remove('zero'); }

  list.innerHTML = msgs.map(m => {
    const dt = new Date(m.created_at).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
    const chi = escapeHtml(m.username || m.email || 'Utente');
    const mail = m.email ? ` · ${escapeHtml(m.email)}` : '';
    return `
      <div class="pending-item" data-id="${m.id}" style="flex-direction:column;align-items:stretch;gap:8px">
        ${m.oggetto ? `<div class="nome">${escapeHtml(m.oggetto)}</div>` : ''}
        <div class="meta">${chi}${mail} · ${dt}</div>
        <div class="msg-testo">${escapeHtml(m.testo)}</div>
        <textarea id="risposta-${m.id}" class="risposta-input" placeholder="Scrivi una risposta…"></textarea>
        <div class="pending-actions" style="justify-content:flex-end;gap:6px">
          <button class="btn-mini reject" onclick="chiudiMessaggio('${m.id}')">Chiudi senza rispondere</button>
          <button class="btn-mini approve" onclick="rispondiMessaggio('${m.id}')">✓ Rispondi e chiudi</button>
        </div>
      </div>`;
  }).join('');
}

async function chiudiMessaggio(id) {
  if (!confirm('Segnare questa richiesta come chiusa senza rispondere?')) return;

  const { data: { session } } = await sb.auth.getSession();
  const { error } = await sb.from('messaggi_admin').update({
    stato: 'chiusa',
    chiusa_at: new Date().toISOString(),
    chiusa_by: session && session.user ? session.user.id : null,
  }).eq('id', id);

  if (error) { alert('Errore: ' + error.message); return; }
  rimuoviMessaggioRisolto(id);
}

async function rispondiMessaggio(id) {
  const ta = document.getElementById('risposta-' + id);
  const testo = (ta ? ta.value : '').trim();
  if (!testo) { alert('Scrivi una risposta prima di inviare.'); return; }

  const { data: { session } } = await sb.auth.getSession();
  const { error } = await sb.from('messaggi_admin').update({
    risposta: testo,
    risposta_at: new Date().toISOString(),
    stato: 'chiusa',
    chiusa_at: new Date().toISOString(),
    chiusa_by: session && session.user ? session.user.id : null,
  }).eq('id', id);

  if (error) { alert('Errore: ' + error.message); return; }
  rimuoviMessaggioRisolto(id);
}

// Rimuove la richiesta dalla lista aperte e aggiorna il badge
function rimuoviMessaggioRisolto(id) {
  const el = document.querySelector(`#messaggiList .pending-item[data-id="${id}"]`);
  if (el) el.remove();

  const badge = document.querySelector('.messaggi-badge');
  if (badge) {
    const n = Math.max(0, (parseInt(badge.textContent, 10) || 0) - 1);
    badge.textContent = String(n);
    if (n === 0) {
      badge.classList.add('zero');
      const list = document.getElementById('messaggiList');
      if (list) list.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px">Nessuna richiesta aperta</div>';
    }
  }
}

// Cache famiglie/sottocategorie per il form
let _famiglieCache = null;
let _sottocategorieCache = null;

async function caricaFamiglieSottocategorie() {
  if (_famiglieCache && _sottocategorieCache) return;
  const [fam, sub] = await Promise.all([
    sb.from('famiglie_olfattive').select('*').order('ordine'),
    sb.from('sottocategorie_olfattive').select('*').order('famiglia_key, ordine'),
  ]);
  _famiglieCache = fam.data || [];
  _sottocategorieCache = sub.data || [];
}

async function apriFormApprova(pendingId, nomeAttuale) {
  await caricaFamiglieSottocategorie();
  const formDiv = document.getElementById('approveForm-' + pendingId);
  if (!formDiv) return;

  // Toggle: se già aperto, chiudi
  if (formDiv.style.display === 'block') {
    formDiv.style.display = 'none';
    formDiv.innerHTML = '';
    return;
  }

  // Costruisci il form
  const famOptions = _famiglieCache.map(f => 
    `<option value="${f.key}">${escapeHtml(f.label)}</option>`
  ).join('');

  formDiv.innerHTML = `
    <div class="approve-form-inner">
      <label class="approve-label">Nome (modificabile)</label>
      <input type="text" id="approveNome-${pendingId}" value="${escapeAttr(nomeAttuale)}" class="approve-input">

      <div class="approve-row">
        <div style="flex:1">
          <label class="approve-label">Famiglia</label>
          <select id="approveFam-${pendingId}" class="approve-input" onchange="aggiornaSottocategorie('${pendingId}')">
            <option value="">— scegli —</option>
            ${famOptions}
          </select>
        </div>
        <div style="flex:1">
          <label class="approve-label">Sottocategoria</label>
          <select id="approveSub-${pendingId}" class="approve-input">
            <option value="">— prima scegli famiglia —</option>
          </select>
        </div>
      </div>

      <div class="approve-actions">
        <button class="btn-mini" style="border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6)" onclick="apriFormApprova('${pendingId}', '${escapeAttr(nomeAttuale)}')">Annulla</button>
        <button class="btn-mini approve" onclick="confermaApprova('${pendingId}')">✓ Conferma</button>
      </div>
    </div>
  `;
  formDiv.style.display = 'block';

  // Auto-focus sul campo nome
  const inp = document.getElementById('approveNome-' + pendingId);
  if (inp) {
    inp.focus();
    inp.select();
  }
}

function aggiornaSottocategorie(pendingId) {
  const famKey = document.getElementById('approveFam-' + pendingId).value;
  const subSel = document.getElementById('approveSub-' + pendingId);
  if (!famKey) {
    subSel.innerHTML = '<option value="">— prima scegli famiglia —</option>';
    return;
  }
  const subs = _sottocategorieCache.filter(s => s.famiglia_key === famKey);
  subSel.innerHTML = '<option value="">— scegli —</option>' + 
    subs.map(s => `<option value="${s.id}">${escapeHtml(s.label)}</option>`).join('');
}

async function confermaApprova(pendingId) {
  const nome = document.getElementById('approveNome-' + pendingId).value.trim();
  const subId = document.getElementById('approveSub-' + pendingId).value;

  if (!nome) {
    alert('Il nome è obbligatorio');
    return;
  }
  if (!subId) {
    alert('Devi assegnare una sottocategoria');
    return;
  }

  // Verifica duplicato case-insensitive nella stessa sottocategoria
  const { data: existing } = await sb.from('sentori')
    .select('id, nome, stato')
    .eq('sottocategoria_id', subId)
    .ilike('nome', nome);

  if (existing && existing.length > 0) {
    const altro = existing.find(e => e.id !== pendingId);
    if (altro) {
      const stato = altro.stato === 'attivo' ? 'già presente come sentore attivo' : 'già in attesa';
      if (!confirm(`"${nome}" è ${stato} in questa sottocategoria.\n\nVuoi comunque procedere (verrà mantenuto solo uno per via del vincolo unique)?`)) {
        return;
      }
    }
  }

  // Recupero utente per approvato_by
  const { data: { session } } = await sb.auth.getSession();

  // Promuovi a stato='attivo'
  const { error } = await sb.from('sentori').update({
    nome: nome,
    sottocategoria_id: subId,
    stato: 'attivo',
    approvato_at: new Date().toISOString(),
    approvato_by: session?.user?.id || null,
  }).eq('id', pendingId);

  if (error) {
    if (error.code === '23505') {
      alert('Esiste già un sentore con lo stesso nome in quella sottocategoria. Operazione annullata.');
    } else {
      alert('Errore: ' + error.message);
    }
    return;
  }

  // Invalida cache aromi (così la prossima apertura degusta carica il nuovo sentore)
  try { localStorage.removeItem('cantinapp_aromi_cache_v1'); } catch (e) {}

  // Rimuovi dal DOM e aggiorna contatori
  const el = document.querySelector(`.pending-item[data-id="${pendingId}"]`);
  if (el) el.remove();
  aggiornaBadgePending(-1);
  incrementaContatoreSentori(1);
}

function aggiornaBadgePending(delta) {
  const badge = document.querySelector('.pending-badge');
  if (!badge) return;
  const current = parseInt(badge.textContent) || 0;
  const next = Math.max(0, current + delta);
  badge.textContent = next;
  if (next === 0) {
    badge.classList.add('zero');
    const list = document.getElementById('pendingList');
    if (list) list.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-size:13px">Nessuna voce in attesa</div>';
  }
}

function incrementaContatoreSentori(delta) {
  // Cerca la stat-row con label "Sentori attivi" e aggiorna il valore
  const rows = document.querySelectorAll('.stat-row');
  for (const r of rows) {
    if (r.textContent.includes('Sentori attivi')) {
      const v = r.querySelector('.v');
      if (v) {
        const cur = parseInt(v.textContent) || 0;
        v.textContent = cur + delta;
      }
      break;
    }
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Per attributi HTML (es. value="..."): escape anche apici singoli per inline onclick
function escapeAttr(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function rifiutaPending(id) {
  if (!confirm('Rifiutare questa voce?')) return;
  const { error } = await sb.from('sentori').delete().eq('id', id);
  if (error) {
    alert('Errore: ' + error.message);
    return;
  }
  // Rimuovi dal DOM e aggiorna badge
  const el = document.querySelector(`.pending-item[data-id="${id}"]`);
  if (el) el.remove();
  aggiornaBadgePending(-1);
}

// ============================================================
// SEZIONI CRUD: cache globale dei dati
// ============================================================

let _allFamiglie = [];
let _allSottocategorie = [];
let _allSentori = [];

async function caricaTuttiDati() {
  const [famR, subR, sentR] = await Promise.all([
    sb.from('famiglie_olfattive').select('*').order('ordine'),
    sb.from('sottocategorie_olfattive').select('*').order('famiglia_key, ordine'),
    sb.from('sentori').select('*').eq('stato', 'attivo').order('nome'),
  ]);
  _allFamiglie = famR.data || [];
  _allSottocategorie = subR.data || [];
  _allSentori = sentR.data || [];
  _famiglieCache = _allFamiglie;
  _sottocategorieCache = _allSottocategorie;
}

function invalidaCacheAromiClient() {
  try { localStorage.removeItem('cantinapp_aromi_cache_v1'); } catch (e) {}
}

// ============================================================
// ALBERO UNIFICATO: famiglia → sottocategoria → sentore
// Tutti i livelli espandibili/collassabili individualmente
// Tutti i livelli con azioni CRUD inline
// ============================================================

// Set di chiavi/id espansi (multi-espansione, niente "solo uno alla volta")
let _famExpanded = new Set();
let _subExpanded = new Set();

function renderAlberoSentori() {
  const tree = document.getElementById('alberoSentori');
  if (!tree) return;
  const search = (document.getElementById('searchSentori').value || '').toLowerCase().trim();

  // Ricerca: lista piatta di sentori che matchano
  if (search) {
    const matches = _allSentori.filter(s => s.nome.toLowerCase().includes(search));
    if (matches.length === 0) {
      tree.innerHTML = '<div class="placeholder-text" style="text-align:center;padding:20px">Nessun sentore corrispondente</div>';
      return;
    }
    tree.innerHTML = `
      <div class="placeholder-text" style="margin-bottom:8px">${matches.length} risultati per "${escapeHtml(search)}"</div>
      ${matches.map(s => renderSentoreRow(s, true)).join('')}
    `;
    return;
  }

  // Albero gerarchico
  tree.innerHTML = _allFamiglie.map(fam => renderFamigliaNode(fam)).join('');
}

function renderFamigliaNode(fam) {
  const subs = _allSottocategorie.filter(s => s.famiglia_key === fam.key);
  const totSentori = subs.reduce((tot, s) => tot + _allSentori.filter(se => se.sottocategoria_id === s.id).length, 0);
  const isOpen = _famExpanded.has(fam.key);

  return `
    <div class="tree-fam" data-key="${fam.key}">
      <div class="tree-fam-header">
        <i class="ti ti-chevron-${isOpen ? 'down' : 'right'} tree-toggle" onclick="toggleFamiglia('${fam.key}')"></i>
        <span class="tree-color-dot" style="background:${fam.color || '#888'}" onclick="toggleFamiglia('${fam.key}')"></span>
        <span class="tree-fam-label" onclick="toggleFamiglia('${fam.key}')">${escapeHtml(fam.label)}</span>
        <span class="tree-count" onclick="toggleFamiglia('${fam.key}')">${subs.length} sottocat · ${totSentori} sentori</span>
        <div class="sent-actions">
          <button class="icon-btn" title="Modifica famiglia" onclick="modificaFamiglia('${fam.key}')"><i class="ti ti-edit"></i></button>
          <button class="icon-btn danger" title="Elimina famiglia" onclick="eliminaFamiglia('${fam.key}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      ${isOpen ? `
        <div class="tree-fam-body">
          <div class="tree-add-row">
            <button class="btn-add-inline" onclick="apriFormAggiungiSottocategoria('${fam.key}')">
              <i class="ti ti-plus"></i> Aggiungi sottocategoria a "${escapeHtml(fam.label)}"
            </button>
          </div>
          ${subs.length === 0
            ? '<div class="placeholder-text" style="padding:8px 0;font-size:11px">Nessuna sottocategoria.</div>'
            : subs.map(sub => renderSottocategoriaNode(sub)).join('')
          }
        </div>
      ` : ''}
    </div>
  `;
}

function renderSottocategoriaNode(sub) {
  const sentori = _allSentori.filter(se => se.sottocategoria_id === sub.id);
  const isOpen = _subExpanded.has(sub.id);
  const compatStr = (sub.compat || []).join(', ');

  return `
    <div class="tree-sub" data-id="${sub.id}">
      <div class="tree-sub-header">
        <i class="ti ti-chevron-${isOpen ? 'down' : 'right'} tree-toggle" onclick="toggleSottocategoria('${sub.id}')"></i>
        <div class="tree-sub-text" onclick="toggleSottocategoria('${sub.id}')">
          <div class="tree-sub-label">${escapeHtml(sub.label)}</div>
          ${compatStr ? `<div class="tree-sub-meta">${escapeHtml(compatStr)}</div>` : ''}
        </div>
        <span class="tree-count" onclick="toggleSottocategoria('${sub.id}')">${sentori.length}</span>
        <div class="sent-actions">
          <button class="icon-btn" title="Modifica sottocategoria" onclick="modificaSottocategoria('${sub.id}')"><i class="ti ti-edit"></i></button>
          <button class="icon-btn danger" title="Elimina sottocategoria" onclick="eliminaSottocategoria('${sub.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      ${isOpen ? `
        <div class="tree-sub-body">
          <div class="tree-add-row">
            <button class="btn-add-inline" onclick="apriFormAggiungiSentore('${sub.id}')">
              <i class="ti ti-plus"></i> Aggiungi sentore a "${escapeHtml(sub.label)}"
            </button>
          </div>
          ${sentori.length === 0
            ? '<div class="placeholder-text" style="padding:6px 0;font-size:11px">Nessun sentore.</div>'
            : sentori.map(se => renderSentoreRow(se, false)).join('')
          }
        </div>
      ` : ''}
    </div>
  `;
}

function renderSentoreRow(sent, showContext) {
  const sub = _allSottocategorie.find(s => s.id === sent.sottocategoria_id);
  const fam = sub ? _allFamiglie.find(f => f.key === sub.famiglia_key) : null;
  const ctx = showContext && sub && fam
    ? `<div class="sent-ctx">${escapeHtml(fam.label)} → ${escapeHtml(sub.label)}</div>` : '';
  return `
    <div class="sent-row" data-id="${sent.id}">
      <div style="flex:1;min-width:0">
        <div class="sent-nome">${escapeHtml(sent.nome)}</div>
        ${ctx}
      </div>
      <div class="sent-actions">
        <button class="icon-btn" title="Rinomina" onclick="rinominaSentore('${sent.id}')"><i class="ti ti-edit"></i></button>
        <button class="icon-btn" title="Sposta" onclick="spostaSentore('${sent.id}')"><i class="ti ti-arrows-exchange"></i></button>
        <button class="icon-btn danger" title="Elimina" onclick="eliminaSentore('${sent.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>
  `;
}

function toggleFamiglia(key) {
  if (_famExpanded.has(key)) _famExpanded.delete(key);
  else _famExpanded.add(key);
  renderAlberoSentori();
}

function toggleSottocategoria(id) {
  if (_subExpanded.has(id)) _subExpanded.delete(id);
  else _subExpanded.add(id);
  renderAlberoSentori();
}

function espandiTutto() {
  for (const f of _allFamiglie) _famExpanded.add(f.key);
  for (const s of _allSottocategorie) _subExpanded.add(s.id);
  renderAlberoSentori();
}

function collassaTutto() {
  _famExpanded.clear();
  _subExpanded.clear();
  renderAlberoSentori();
}

function filtraSentori() {
  renderAlberoSentori();
}

async function rinominaSentore(id) {
  const sent = _allSentori.find(s => s.id === id);
  if (!sent) return;
  const nuovo = prompt(`Rinomina "${sent.nome}":`, sent.nome);
  if (!nuovo || nuovo.trim() === '' || nuovo.trim() === sent.nome) return;
  const nome = nuovo.trim();
  const dupe = _allSentori.find(s => 
    s.id !== id && 
    s.sottocategoria_id === sent.sottocategoria_id && 
    s.nome.toLowerCase() === nome.toLowerCase()
  );
  if (dupe) { alert(`Esiste già "${dupe.nome}" in questa sottocategoria.`); return; }
  const { error } = await sb.from('sentori').update({ nome }).eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  sent.nome = nome;
  _allSentori.sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
  invalidaCacheAromiClient();
  renderAlberoSentori();
}

async function spostaSentore(id) {
  const sent = _allSentori.find(s => s.id === id);
  if (!sent) return;
  const subAttuale = _allSottocategorie.find(s => s.id === sent.sottocategoria_id);
  const famAttuale = subAttuale ? _allFamiglie.find(f => f.key === subAttuale.famiglia_key) : null;

  const famLabels = _allFamiglie.map((f, i) => `${i+1}. ${f.label}`).join('\n');
  const famScelta = prompt(
    `Sposta "${sent.nome}"\nAttualmente in: ${famAttuale?.label || '?'} → ${subAttuale?.label || '?'}\n\nScegli numero famiglia di destinazione:\n${famLabels}`
  );
  if (!famScelta) return;
  const famIdx = parseInt(famScelta) - 1;
  if (isNaN(famIdx) || famIdx < 0 || famIdx >= _allFamiglie.length) { alert('Scelta non valida'); return; }
  const newFam = _allFamiglie[famIdx];
  const subs = _allSottocategorie.filter(s => s.famiglia_key === newFam.key);
  if (subs.length === 0) { alert('Questa famiglia non ha sottocategorie.'); return; }
  const subLabels = subs.map((s, i) => `${i+1}. ${s.label}`).join('\n');
  const subScelta = prompt(`Famiglia: ${newFam.label}\n\nScegli numero sottocategoria:\n${subLabels}`);
  if (!subScelta) return;
  const subIdx = parseInt(subScelta) - 1;
  if (isNaN(subIdx) || subIdx < 0 || subIdx >= subs.length) { alert('Scelta non valida'); return; }
  const newSub = subs[subIdx];

  const dupe = _allSentori.find(s => 
    s.id !== id && s.sottocategoria_id === newSub.id && 
    s.nome.toLowerCase() === sent.nome.toLowerCase()
  );
  if (dupe) { alert(`Esiste già "${dupe.nome}" in ${newFam.label} → ${newSub.label}.`); return; }

  const { error } = await sb.from('sentori').update({ sottocategoria_id: newSub.id }).eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  sent.sottocategoria_id = newSub.id;
  invalidaCacheAromiClient();
  renderAlberoSentori();
}

async function eliminaSentore(id) {
  const sent = _allSentori.find(s => s.id === id);
  if (!sent) return;
  if (!confirm(`Eliminare il sentore "${sent.nome}"?\n\nQuesta operazione è definitiva.`)) return;
  const { error } = await sb.from('sentori').delete().eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  _allSentori = _allSentori.filter(s => s.id !== id);
  invalidaCacheAromiClient();
  incrementaContatoreSentori(-1);
  renderAlberoSentori();
}

function apriFormAggiungiSentore(subIdPredefinito) {
  const div = document.getElementById('formAggiungiSentore');
  if (div.style.display === 'block') {
    div.style.display = 'none'; div.innerHTML = ''; return;
  }
  // Se viene passato subIdPredefinito, lo usiamo come default
  const subPre = subIdPredefinito ? _allSottocategorie.find(s => s.id === subIdPredefinito) : null;
  const famPre = subPre ? subPre.famiglia_key : '';
  const famOptions = _allFamiglie.map(f => 
    `<option value="${f.key}"${f.key === famPre ? ' selected' : ''}>${escapeHtml(f.label)}</option>`
  ).join('');
  const subOptions = famPre
    ? _allSottocategorie.filter(s => s.famiglia_key === famPre).map(s =>
        `<option value="${s.id}"${s.id === subIdPredefinito ? ' selected' : ''}>${escapeHtml(s.label)}</option>`
      ).join('')
    : '';

  div.innerHTML = `
    <div class="approve-form-inner" style="margin-bottom:12px">
      <label class="approve-label">Nome sentore</label>
      <input type="text" id="newSentoreNome" class="approve-input" placeholder="es. mirto, china, ribes nero">
      <div class="approve-row">
        <div style="flex:1">
          <label class="approve-label">Famiglia</label>
          <select id="newSentoreFam" class="approve-input" onchange="aggiornaSubNewSentore()">
            <option value="">— scegli —</option>${famOptions}
          </select>
        </div>
        <div style="flex:1">
          <label class="approve-label">Sottocategoria</label>
          <select id="newSentoreSub" class="approve-input">
            ${subOptions ? '<option value="">— scegli —</option>' + subOptions : '<option value="">— prima scegli famiglia —</option>'}
          </select>
        </div>
      </div>
      <div class="approve-actions">
        <button class="btn-mini" style="border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6)" onclick="apriFormAggiungiSentore()">Annulla</button>
        <button class="btn-mini approve" onclick="salvaNuovoSentore()">✓ Aggiungi</button>
      </div>
    </div>
  `;
  div.style.display = 'block';
  div.scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('newSentoreNome').focus();
}

function aggiornaSubNewSentore() {
  const famKey = document.getElementById('newSentoreFam').value;
  const subSel = document.getElementById('newSentoreSub');
  if (!famKey) { subSel.innerHTML = '<option value="">— prima scegli famiglia —</option>'; return; }
  const subs = _allSottocategorie.filter(s => s.famiglia_key === famKey);
  subSel.innerHTML = '<option value="">— scegli —</option>' +
    subs.map(s => `<option value="${s.id}">${escapeHtml(s.label)}</option>`).join('');
}

async function salvaNuovoSentore() {
  const nome = document.getElementById('newSentoreNome').value.trim();
  const subId = document.getElementById('newSentoreSub').value;
  if (!nome) { alert('Inserisci il nome'); return; }
  if (!subId) { alert('Scegli una sottocategoria'); return; }
  const dupe = _allSentori.find(s =>
    s.sottocategoria_id === subId && s.nome.toLowerCase() === nome.toLowerCase()
  );
  if (dupe) { alert(`Esiste già "${dupe.nome}" in questa sottocategoria.`); return; }

  const { data: { session } } = await sb.auth.getSession();
  const { data: nuovo, error } = await sb.from('sentori').insert({
    nome, sottocategoria_id: subId, stato: 'attivo',
    created_by: session?.user?.id || null,
    approvato_at: new Date().toISOString(),
    approvato_by: session?.user?.id || null,
  }).select().single();

  if (error) { alert('Errore: ' + error.message); return; }
  _allSentori.push(nuovo);
  _allSentori.sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
  invalidaCacheAromiClient();
  incrementaContatoreSentori(1);
  apriFormAggiungiSentore();
  renderAlberoSentori();
}

function apriFormAggiungiSottocategoria(famKeyPredefinita) {
  const div = document.getElementById('formAggiungiSottocategoria');
  if (div.style.display === 'block') {
    div.style.display = 'none'; div.innerHTML = ''; return;
  }
  const famOptions = _allFamiglie.map(f => 
    `<option value="${f.key}"${f.key === famKeyPredefinita ? ' selected' : ''}>${escapeHtml(f.label)}</option>`
  ).join('');
  div.innerHTML = `
    <div class="approve-form-inner" style="margin-bottom:12px">
      <label class="approve-label">Famiglia</label>
      <select id="newSubFam" class="approve-input">
        <option value="">— scegli —</option>${famOptions}
      </select>
      <label class="approve-label">Label (visualizzato)</label>
      <input type="text" id="newSubLabel" class="approve-input" placeholder="es. Erbe officinali">
      <label class="approve-label">Key (identificatore, lettere/numeri/underscore)</label>
      <input type="text" id="newSubKey" class="approve-input" placeholder="es. erbe_officinali">
      <label class="approve-label">Compatibilità (separate da virgola)</label>
      <input type="text" id="newSubCompat" class="approve-input" placeholder="rosso, bianco, rosato, spumante, passito, liquoroso">
      <div class="approve-actions">
        <button class="btn-mini" style="border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6)" onclick="apriFormAggiungiSottocategoria()">Annulla</button>
        <button class="btn-mini approve" onclick="salvaNuovaSottocategoria()">✓ Aggiungi</button>
      </div>
    </div>
  `;
  div.style.display = 'block';
  div.scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('newSubLabel').addEventListener('input', (e) => {
    const keyInp = document.getElementById('newSubKey');
    if (keyInp.value === '' || keyInp.dataset.auto === '1') {
      keyInp.value = slugify(e.target.value);
      keyInp.dataset.auto = '1';
    }
  });
  document.getElementById('newSubKey').addEventListener('input', (e) => { e.target.dataset.auto = '0'; });
  document.getElementById('newSubLabel').focus();
}

function slugify(s) {
  return String(s).toLowerCase()
    .replace(/[àáâãäå]/g, 'a').replace(/[èéêë]/g, 'e').replace(/[ìíîï]/g, 'i')
    .replace(/[òóôõö]/g, 'o').replace(/[ùúûü]/g, 'u').replace(/ç/g, 'c').replace(/ñ/g, 'n')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').substring(0, 40);
}

async function salvaNuovaSottocategoria() {
  const famKey = document.getElementById('newSubFam').value;
  const label = document.getElementById('newSubLabel').value.trim();
  const key = document.getElementById('newSubKey').value.trim();
  const compatStr = document.getElementById('newSubCompat').value.trim();
  if (!famKey) { alert('Scegli una famiglia'); return; }
  if (!label) { alert('Inserisci il label'); return; }
  if (!key || !/^[a-z0-9_]+$/.test(key)) { alert('Key non valida (solo a-z, 0-9, _)'); return; }
  const compat = compatStr ? compatStr.split(',').map(c => c.trim()).filter(Boolean) : null;
  if (_allSottocategorie.find(s => s.famiglia_key === famKey && s.key === key)) {
    alert(`Esiste già una sottocategoria con key "${key}" in questa famiglia.`); return;
  }
  const ordineMax = Math.max(0, ..._allSottocategorie.filter(s => s.famiglia_key === famKey).map(s => s.ordine || 0));
  const { data: nuovo, error } = await sb.from('sottocategorie_olfattive').insert({
    famiglia_key: famKey, key, label, compat, ordine: ordineMax + 1
  }).select().single();
  if (error) { alert('Errore: ' + error.message); return; }
  _allSottocategorie.push(nuovo);
  invalidaCacheAromiClient();
  apriFormAggiungiSottocategoria();
  renderListaSottocategorie();
  renderAlberoSentori();
  aggiornaStatRow('Sottocategorie', _allSottocategorie.length);
}

async function modificaSottocategoria(id) {
  const sub = _allSottocategorie.find(s => s.id === id);
  if (!sub) return;
  const nuovoLabel = prompt(`Modifica label di "${sub.label}":`, sub.label);
  if (!nuovoLabel || nuovoLabel.trim() === sub.label) return;
  const compatCur = (sub.compat || []).join(', ');
  const nuovaCompat = prompt(`Compatibilità (separate da virgola):`, compatCur);
  if (nuovaCompat === null) return;
  const compat = nuovaCompat.trim() ? nuovaCompat.split(',').map(c => c.trim()).filter(Boolean) : null;

  const { error } = await sb.from('sottocategorie_olfattive').update({
    label: nuovoLabel.trim(), compat
  }).eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  sub.label = nuovoLabel.trim();
  sub.compat = compat;
  invalidaCacheAromiClient();
  renderListaSottocategorie();
  renderAlberoSentori();
}

async function eliminaSottocategoria(id) {
  const sub = _allSottocategorie.find(s => s.id === id);
  if (!sub) return;
  const fam = _allFamiglie.find(f => f.key === sub.famiglia_key);
  const sentoriContenuti = _allSentori.filter(s => s.sottocategoria_id === id);

  // Caso 1: sottocategoria vuota → eliminazione diretta
  if (sentoriContenuti.length === 0) {
    if (!confirm(`Eliminare la sottocategoria vuota "${sub.label}"?`)) return;
    const { error } = await sb.from('sottocategorie_olfattive').delete().eq('id', id);
    if (error) { alert('Errore: ' + error.message); return; }
    _allSottocategorie = _allSottocategorie.filter(s => s.id !== id);
    invalidaCacheAromiClient();
    renderListaSottocategorie();
    renderAlberoSentori();
    aggiornaStatRow('Sottocategorie', _allSottocategorie.length);
    return;
  }

  // Caso 2: contiene sentori → chiedi destinazione per spostarli
  // Costruisci elenco delle altre sottocategorie (escluse quella corrente)
  const destinazioniDisponibili = _allSottocategorie.filter(s => s.id !== id);
  if (destinazioniDisponibili.length === 0) {
    alert(`La sottocategoria "${sub.label}" contiene ${sentoriContenuti.length} sentori ma non ci sono altre sottocategorie dove spostarli.\n\nCrea prima un'altra sottocategoria oppure elimina manualmente i sentori.`);
    return;
  }

  // Mostra prompt: prima la famiglia, poi la sottocategoria
  const famLabels = _allFamiglie.map((f, i) => `${i+1}. ${f.label}`).join('\n');
  const famScelta = prompt(
    `"${sub.label}" contiene ${sentoriContenuti.length} sentori.\n\n` +
    `Per eliminarla devi prima spostare i sentori in un'altra sottocategoria.\n\n` +
    `Scegli numero famiglia di destinazione:\n${famLabels}`
  );
  if (!famScelta) return;
  const famIdx = parseInt(famScelta) - 1;
  if (isNaN(famIdx) || famIdx < 0 || famIdx >= _allFamiglie.length) {
    alert('Scelta non valida'); return;
  }
  const newFam = _allFamiglie[famIdx];
  // Filtra le sottocategorie della famiglia scelta, escludendo quella corrente
  const subDest = _allSottocategorie.filter(s => s.famiglia_key === newFam.key && s.id !== id);
  if (subDest.length === 0) {
    alert(`La famiglia "${newFam.label}" non ha altre sottocategorie disponibili.`);
    return;
  }
  const subLabels = subDest.map((s, i) => `${i+1}. ${s.label}`).join('\n');
  const subScelta = prompt(`Famiglia: ${newFam.label}\n\nScegli sottocategoria di destinazione:\n${subLabels}`);
  if (!subScelta) return;
  const subIdx = parseInt(subScelta) - 1;
  if (isNaN(subIdx) || subIdx < 0 || subIdx >= subDest.length) {
    alert('Scelta non valida'); return;
  }
  const newSub = subDest[subIdx];

  // Verifica duplicati case-insensitive nella sottocategoria di destinazione
  const nomiDest = new Set(
    _allSentori
      .filter(s => s.sottocategoria_id === newSub.id)
      .map(s => s.nome.toLowerCase())
  );
  const conflitti = sentoriContenuti.filter(s => nomiDest.has(s.nome.toLowerCase()));
  if (conflitti.length > 0) {
    const nomiConf = conflitti.map(s => '"' + s.nome + '"').join(', ');
    if (!confirm(
      `Attenzione: ${conflitti.length} sentori esistono già in "${newSub.label}":\n${nomiConf}\n\n` +
      `Questi non verranno spostati (resteranno orfani e l'eliminazione fallirà).\n\n` +
      `Vuoi procedere comunque? Ti consiglio di:\n` +
      `- Annullare\n- Rinominare manualmente i duplicati nella sottocategoria di destinazione\n- Poi riprovare\n\nProcedere?`
    )) return;
  }

  // Conferma finale
  if (!confirm(
    `Spostare ${sentoriContenuti.length - conflitti.length} sentori da "${sub.label}" a "${newFam.label} → ${newSub.label}" ` +
    `e poi eliminare "${sub.label}"?`
  )) return;

  // Esegui spostamento sentori (solo quelli senza conflitti)
  const daSpostare = sentoriContenuti.filter(s => !nomiDest.has(s.nome.toLowerCase()));
  if (daSpostare.length > 0) {
    const { error: errSpost } = await sb.from('sentori')
      .update({ sottocategoria_id: newSub.id })
      .in('id', daSpostare.map(s => s.id));
    if (errSpost) {
      alert('Errore durante spostamento: ' + errSpost.message);
      return;
    }
  }

  // Se ci sono ancora sentori orfani (conflitti) blocca l'eliminazione
  const ancoraDentro = sentoriContenuti.length - daSpostare.length;
  if (ancoraDentro > 0) {
    alert(`Spostati ${daSpostare.length} sentori. ${ancoraDentro} sentori non sono stati spostati (duplicati).\n\nLa sottocategoria "${sub.label}" non può essere eliminata finché contiene sentori. Eliminali o spostali manualmente.`);
    // Aggiorna cache locale comunque
    for (const s of daSpostare) {
      const ref = _allSentori.find(x => x.id === s.id);
      if (ref) ref.sottocategoria_id = newSub.id;
    }
    invalidaCacheAromiClient();
    renderListaSottocategorie();
    renderAlberoSentori();
    return;
  }

  // Adesso la sottocategoria è vuota, possiamo eliminarla
  const { error } = await sb.from('sottocategorie_olfattive').delete().eq('id', id);
  if (error) {
    alert('Errore eliminazione: ' + error.message);
    return;
  }

  // Aggiorna cache locale
  for (const s of daSpostare) {
    const ref = _allSentori.find(x => x.id === s.id);
    if (ref) ref.sottocategoria_id = newSub.id;
  }
  _allSottocategorie = _allSottocategorie.filter(s => s.id !== id);
  invalidaCacheAromiClient();
  renderListaSottocategorie();
  renderAlberoSentori();
  aggiornaStatRow('Sottocategorie', _allSottocategorie.length);
}

async function salvaNuovaFamiglia() {

async function modificaFamiglia(key) {

  if (nuovoColor === null) return;
  const { error } = await sb.from('famiglie_olfattive').update({
    label: nuovoLabel.trim(),
    color: nuovoColor.trim() || '#888888',
  }).eq('id', fam.id);
  if (error) { alert('Errore: ' + error.message); return; }
  fam.label = nuovoLabel.trim();
  fam.color = nuovoColor.trim() || '#888888';
  invalidaCacheAromiClient();
  renderListaFamiglie();
  renderListaSottocategorie();
  renderAlberoSentori();
}

async function eliminaFamiglia(key) {
  const fam = _allFamiglie.find(f => f.key === key);
  if (!fam) return;
  const subs = _allSottocategorie.filter(s => s.famiglia_key === key);
  const nSentori = _allSentori.filter(se => subs.some(s => s.id === se.sottocategoria_id)).length;
  let msg = `Eliminare la famiglia "${fam.label}"?`;
  if (subs.length > 0) {
    msg += `\n\n⚠ Contiene ${subs.length} sottocategorie e ${nSentori} sentori che verranno anch'essi eliminati (cascade).`;
  }
  if (!confirm(msg)) return;
  const { error } = await sb.from('famiglie_olfattive').delete().eq('id', fam.id);
  if (error) { alert('Errore: ' + error.message); return; }
  _allFamiglie = _allFamiglie.filter(f => f.key !== key);
  _allSottocategorie = _allSottocategorie.filter(s => s.famiglia_key !== key);
  _allSentori = _allSentori.filter(se => !subs.some(s => s.id === se.sottocategoria_id));
  invalidaCacheAromiClient();
  renderListaFamiglie();
  renderListaSottocategorie();
  renderAlberoSentori();
  aggiornaStatRow('Famiglie olfattive', _allFamiglie.length);
  aggiornaStatRow('Sottocategorie', _allSottocategorie.length);
  aggiornaStatRow('Sentori attivi', _allSentori.length);
}

function aggiornaStatRow(label, value) {
  const rows = document.querySelectorAll('.stat-row');
  for (const r of rows) {
    if (r.textContent.includes(label)) {
      const v = r.querySelector('.v');
      if (v) v.textContent = value;
      break;
    }
  }
}

// ============================================================
// EXPORT aromi-data.js
// ============================================================

function esportaAromiDataJs() {
  const out = {};
  for (const fam of _allFamiglie) {
    out[fam.key] = { label: fam.label, color: fam.color || '#888888', subcategories: {} };
  }
  for (const sub of _allSottocategorie) {
    if (!out[sub.famiglia_key]) continue;
    out[sub.famiglia_key].subcategories[sub.key] = {
      label: sub.label, compat: sub.compat || [], sentori: []
    };
  }
  for (const sent of _allSentori) {
    const sub = _allSottocategorie.find(s => s.id === sent.sottocategoria_id);
    if (!sub) continue;
    if (out[sub.famiglia_key] && out[sub.famiglia_key].subcategories[sub.key]) {
      out[sub.famiglia_key].subcategories[sub.key].sentori.push(sent.nome);
    }
  }
  for (const fam of Object.values(out)) {
    for (const sub of Object.values(fam.subcategories)) {
      sub.sentori.sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
    }
  }
  const oggi = new Date().toISOString().split('T')[0];
  const content = `// ============================================================
// CantinApp — Aromi/Sentori (fallback offline)
// ============================================================
// Generato dal pannello Admin il ${oggi}
// Allineato al database Supabase.
// Modifiche manuali a questo file verranno sovrascritte al prossimo export.
// ============================================================

const AROMI = ${JSON.stringify(out, null, 2)};
`;
  const blob = new Blob([content], { type: 'application/javascript;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aromi-data.js';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
