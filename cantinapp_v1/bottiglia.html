<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a0608">
  <title>CantinApp — Dettaglio bottiglia</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CantinApp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    .header-detail {
      background: var(--nero);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }
    .header-detail .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-detail a, .header-detail button.icon-btn {
      color: var(--oro);
      font-size: 22px;
      text-decoration: none;
      display: flex;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }
    .header-detail h1 {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Bottoni edit mode */
    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.75);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-save {
      background: var(--bordeaux);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-save i { font-size: 16px; }

    /* Modalità edit: bordino oro su section per evidenziare */
    body.editing .info-card {
      border-color: rgba(201,168,76,0.3);
    }
    /* Input inline nei dettagli */
    .info-value-input,
    .info-value-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--avorio);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      width: 100%;
      max-width: 200px;
      text-align: right;
    }
    .info-value-input:focus,
    .info-value-select:focus {
      border-color: var(--oro);
      outline: none;
      background: rgba(255,255,255,0.08);
    }
    .info-row.row-stack {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .info-row.row-stack .info-label {
      flex: none;
    }
    .info-row.row-stack .info-value-input,
    .info-row.row-stack .info-value-select {
      max-width: 100%;
      text-align: left;
    }
    /* Banner promemoria edit mode */
    .edit-banner {
      background: rgba(201,168,76,0.15);
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--oro);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .edit-banner i { font-size: 18px; }

    /* Timeline storico degustazioni */
    .tl-storico {
      position: relative;
      padding-left: 24px;
    }
    .tl-storico::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: rgba(201,168,76,0.25);
    }
    .tl-item {
      position: relative;
      padding-bottom: 20px;
    }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-item::before {
      content: "";
      position: absolute;
      left: -20px;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #C9A84C;
      border: 3px solid #1a0608;
      box-shadow: 0 0 0 1px #C9A84C;
    }
    .tl-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .tl-yr {
      font-size: 15px;
      font-weight: 500;
      color: #C9A84C;
    }
    .tl-date {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }
    .tl-context {
      font-size: 11.5px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }
    .tl-score-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 10px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
    }
    .tl-score {
      font-size: 19px;
      font-weight: 600;
      color: #faf7f4;
    }
    .tl-score-max {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
    .tl-fascia {
      font-size: 11.5px;
      color: #C9A84C;
    }
    .tl-stars {
      margin-left: auto;
      color: #C9A84C;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .tl-stars .star-empty {
      color: rgba(255,255,255,0.18);
    }
    .tl-section {
      margin: 8px 0 4px;
    }
    .tl-section .tl-l {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: block;
      margin-bottom: 3px;
    }
    .tl-section .tl-v {
      font-size: 12.5px;
      color: #faf7f4;
      line-height: 1.5;
    }
    .tl-section .tl-v.tl-note {
      font-style: italic;
      color: rgba(255,255,255,0.75);
    }
    .tl-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: #C9A84C;
      margin-top: 8px;
      text-decoration: none;
      padding: 4px 9px;
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 5px;
    }
    .tl-link i { font-size: 14px; }

    .hero-photo {
      width: 100%;
      height: 280px;
      background: var(--avorio-dk);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .hero-slide {
      display: none;
      width: 100%;
      height: 100%;
    }
    .hero-slide.active { display: block; }
    .hero-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .hero-photo .no-photo {
      font-size: 80px;
      color: var(--bordo-dk);
    }
    .hero-photo .tip-tag {
      position: absolute;
      top: 12px; left: 12px;
    }
    .hero-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(26,6,8,.5);
      padding: 6px 10px;
      border-radius: var(--radius-pill);
    }
    .hero-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background .15s;
    }
    .hero-dot.active { background: var(--oro); }
    .hero-side-tag {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(26,6,8,.65);
      color: var(--oro);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .wine-title {
      padding: 20px 20px 8px;
      max-width: 480px;
      margin: 0 auto;
    }
    .wine-title h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--avorio);
      margin-bottom: 4px;
    }
    .wine-title .producer {
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      font-style: italic;
    }
    .wine-title .meta-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .quick-actions {
      padding: 12px 20px;
      max-width: 480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .action-btn {
      padding: 14px 12px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--avorio);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all .15s;
      font-family: inherit;
    }
    .action-btn:active { transform: scale(.97); }
    .action-btn i {
      font-size: 22px;
      color: var(--bordeaux);
    }
    .action-btn.degusta {
      background: var(--bordeaux);
      color: #fff;
      border-color: var(--bordeaux);
    }
    .action-btn.degusta i { color: var(--oro); }

    .info-section {
      max-width: 480px;
      margin: 12px auto;
      padding: 0 20px;
    }
    .info-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
    }
    .info-card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--bordeaux);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-card-title i { color: var(--oro); font-size: 16px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--bordo);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: rgba(255,255,255,0.55); }
    .info-value { color: var(--avorio); font-weight: 500; text-align: right; }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--bordeaux);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-display {
      min-width: 32px;
      text-align: center;
      font-weight: 600;
      color: var(--avorio);
    }

    .vitigni-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .vit-chip {
      background: var(--bordeaux-lt);
      color: var(--bordeaux);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
    }

    .danger-zone {
      max-width: 480px;
      margin: 24px auto 100px;
      padding: 0 20px;
    }
    .btn-danger {
      background: transparent;
      color: var(--bordeaux);
      border: 1px solid var(--bordeaux);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.55);
    }
    .loading i {
      font-size: 32px;
      animation: spin .7s linear infinite;
      display: block;
      margin-bottom: 8px;
      color: var(--bordeaux);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal modifica */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,6,8,.6);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 500;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--nero);
      color: var(--avorio);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px 20px 24px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      background: var(--nero);
      z-index: 10;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--oro);
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 26px;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .modal-bottom {
      display: flex;
      gap: 8px;
      padding: 16px 0 4px;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: 20px;
    }
    .modal-bottom .btn {
      padding: 14px;
      font-size: 15px;
    }
  </style>
</head>
<body class="dark">

<div id="loadingArea" class="loading">
  <i class="ti ti-loader-2" aria-hidden="true"></i>
  Caricamento...
</div>

<div id="detailArea" style="display:none">

  <div class="header-detail">
    <div class="left">
      <a href="cantina.html" aria-label="Indietro" id="btnBack">
        <i class="ti ti-arrow-left"></i>
      </a>
      <h1><img src="logo.png" alt="" class="logo-mini"> <span id="headerTitle">Dettaglio bottiglia</span></h1>
    </div>
    <!-- Bottoni dinamici: in view mode mostra matita, in edit mode mostra Annulla/Salva -->
    <div class="header-actions">
      <button class="icon-btn" id="btnEdit" onclick="entraInEdit()" aria-label="Modifica">
        <i class="ti ti-edit"></i>
      </button>
      <button class="btn-ghost" id="btnCancelEdit" onclick="annullaEdit()" style="display:none">
        Annulla
      </button>
      <button class="btn-save" id="btnSaveEdit" onclick="salvaEdit()" style="display:none">
        <i class="ti ti-check"></i> Salva
      </button>
    </div>
  </div>

  <!-- Banner che appare solo in modalità edit -->
  <div class="edit-banner" id="editBanner" style="display:none">
    <i class="ti ti-edit"></i>
    <div>Stai modificando questa bottiglia. Tocca <strong>Salva</strong> in alto a destra per confermare.</div>
  </div>

  <div class="hero-photo" id="heroPhoto">
    <i class="ti ti-bottle-wine no-photo" aria-hidden="true"></i>
    <span class="badge tip-tag" id="tipBadge"></span>
  </div>

  <div class="wine-title">
    <h1 id="wineName">—</h1>
    <div class="producer" id="wineProducer">—</div>
    <div class="meta-badges" id="metaBadges"></div>
  </div>

  <div class="quick-actions">
    <button class="action-btn degusta" onclick="iniziaDegustazione()">
      <i class="ti ti-glass-full"></i>
      Degusta ora
    </button>
    <button class="action-btn" onclick="segnaBevuta()">
      <i class="ti ti-check"></i>
      Segna bevuta
    </button>
  </div>

  <div class="info-section">
    <div class="info-card">
      <div class="info-card-title">
        <i class="ti ti-info-circle"></i>
        Identità del vino
      </div>
      <div id="infoIdentita"></div>
    </div>

    <div class="info-card">
      <div class="info-card-title">
        <i class="ti ti-flask"></i>
        Dati tecnici
      </div>
      <div id="infoTecnici"></div>
    </div>

    <div class="info-card">
      <div class="info-card-title">
        <i class="ti ti-building-warehouse"></i>
        In cantina
      </div>
      <div id="infoCantina"></div>
    </div>

    <div class="info-card" id="cardNote" style="display:none">
      <div class="info-card-title">
        <i class="ti ti-notes"></i>
        Note personali
      </div>
      <div id="infoNote" style="font-size:14px;line-height:1.6;color:rgba(255,255,255,0.55);font-style:italic"></div>
    </div>

    <div class="info-card" id="cardStorico" style="display:none">
      <div class="info-card-title" style="cursor:pointer;justify-content:space-between" onclick="toggleStorico()">
        <span style="display:flex;align-items:center;gap:8px">
          <i class="ti ti-history"></i>
          Storico degustazioni
          <span style="background:rgba(201,168,76,0.15);color:#C9A84C;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">
            <span id="storicoCount">0</span> <span id="storicoCountLabel">degustazioni</span>
          </span>
        </span>
        <i class="ti ti-chevron-up" id="storicoToggleIcon" style="font-size:18px;color:rgba(255,255,255,0.5)"></i>
      </div>
      <div id="storicoTimelineWrap" style="margin-top:14px">
        <div id="storicoTimeline" class="tl-storico"></div>
      </div>
    </div>
  </div>

  <div class="danger-zone">
    <button class="btn btn-danger" onclick="confermaElimina()">
      <i class="ti ti-trash" style="font-size:18px"></i>
      Elimina bottiglia
    </button>
  </div>

</div>


<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/geo-data.js"></script>
<script src="js/geo-coords.js"></script>
<script src="js/bottiglia.js"></script>
</body>
</html>
